<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Bio Saya</title>
    <style>
        /* Gaya Tampilan (CSS) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .profile-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 3px solid white;
            object-fit: cover;
        }
        h1 {
            font-size: 1.2rem;
            margin: 15px 0 5px 0;
        }
        p {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }
        .links-container {
            width: 100%;
            max-width: 400px;
        }
        .link-card {
            background: white;
            color: #333;
            display: block;
            text-align: center;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .link-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <!-- Foto Profil (Ganti URL gambar ini) -->
    <img src="https://placeholder.com" alt="Foto Profil" class="profile-img">

    <!-- Nama & Bio -->
    <h1>Syamkids</h1>
    <p>Selamat datang</p>

    <!-- Daftar Link (Ganti href dengan link Anda) -->
    <div class="links-container">
        <a href="https://wa.me" class="link-card" target="_blank">Hubungi via WhatsApp</a>
        <a href="https://shopee.co.id" class="link-card" target="_blank">Katalog Toko Shopee</a>
        <a href="https://instagram.com" class="link-card" target="_blank">Ikuti di Instagram</a>
        <a href="https://youtube.com" class="link-card" target="_blank">Tonton YouTube Saya</a>
    </div>

</body>
</html>
